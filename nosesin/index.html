<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoseSim — สแกนหน้าและจำลองจมูกแบบเรียลไทม์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14181a; --bg-2:#1b2123; --card:#1e2426;
    --bronze:#c99a5b; --bronze-deep:#8f6b38; --bronze-soft:#e3c390;
    --cream:#f2ece2; --muted:#9a958c; --line:#2e3436; --radius:14px;
    --green:#6fae8a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:500; letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  .wrap{max-width:1160px; margin:0 auto; padding:0 32px;}
  .hidden{display:none !important;}

  /* ---------- login screen ---------- */
  #loginScreen{
    position:fixed; inset:0; z-index:200; background:radial-gradient(circle at 50% 20%, #1c2224, #101415 70%);
    display:flex; align-items:center; justify-content:center; padding:24px; transition:opacity .5s ease;
  }
  .login-card{width:100%; max-width:400px; text-align:center;}
  .login-brand{display:flex; align-items:center; justify-content:center; gap:10px; font-family:'Fraunces',serif; font-size:19px; margin-bottom:28px;}
  .login-brand svg{width:30px; height:30px;}
  .login-card h1{font-size:24px; margin-bottom:8px;}
  .login-card p.sub{font-size:14px; color:var(--muted); margin-bottom:30px;}

  .scan-frame{
    position:relative; width:240px; height:240px; margin:0 auto 22px;
    border-radius:50%; overflow:hidden; background:#0c0f10; border:1px solid var(--line);
  }
  .scan-frame canvas{width:100%; height:100%; object-fit:cover; display:block;}
  .scan-ring{position:absolute; inset:0; width:240px; height:240px; transform:rotate(-90deg);}
  .scan-ring circle{fill:none; stroke-width:3;}
  .scan-ring .bg{stroke:rgba(255,255,255,0.08);}
  .scan-ring .fg{stroke:var(--bronze); stroke-linecap:round; transition:stroke-dashoffset .1s linear;}
  .scan-check{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(20,24,26,0.55); opacity:0; transition:opacity .3s;
  }
  .scan-check.show{opacity:1;}
  .scan-check svg{width:56px; height:56px;}
  .scan-placeholder{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:12px; flex-direction:column; gap:8px; text-align:center; padding: 10px;
  }
  
  /* Loading Spinner */
  .spinner {
    width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%;
    border-top-color: var(--bronze); animation: spin 1s ease-in-out infinite; margin-bottom: 5px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-text{font-size:14px; color:var(--bronze-soft); min-height:20px; margin-bottom:20px;}
  .btn{font-family:'Inter',sans-serif; font-size:13px; padding:11px 22px; border-radius:8px; border:0.5px solid var(--line); background:transparent; color:var(--cream); cursor:pointer; transition:all .2s;}
  .btn:hover{border-color:var(--bronze-deep); color:var(--bronze-soft);}
  .btn.primary{background:var(--bronze); border-color:var(--bronze); color:#1b1204; font-weight:500; width:100%;}
  .btn.primary:hover{background:var(--bronze-soft);}
  .btn:active{transform: scale(0.98);}
  
  .btn-outline { border: 1px solid var(--bronze-deep); color: var(--bronze-soft); display: flex; align-items: center; justify-content: center; gap: 8px;}
  .btn-outline:hover { background: rgba(201, 154, 91, 0.1); }
  .btn-outline:active { background: rgba(201, 154, 91, 0.2); }
  
  .skip-link{display:block; margin-top:16px; font-size:12px; color:var(--muted); text-decoration:underline; cursor:pointer; background:none; border:none;}
  .skip-link:hover{color:var(--bronze-soft);}
  .login-note{font-size:11px; color:var(--muted); margin-top:24px; line-height:1.7; border-top:0.5px solid var(--line); padding-top:16px;}
  .login-note strong{color:var(--bronze-soft); font-weight:500;}

  /* ---------- app screen ---------- */
  nav{position:sticky; top:0; z-index:50; background:rgba(20,24,26,0.86); backdrop-filter:blur(10px); border-bottom:0.5px solid var(--line);}
  nav .wrap{display:flex; align-items:center; justify-content:space-between; height:72px;}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-size:19px; font-weight:500;}
  .brand svg{width:32px; height:32px;}
  nav ul{display:flex; gap:36px; list-style:none; font-size:14px; color:var(--muted);}
  nav ul a{transition:color .2s;}
  nav ul a:hover{color:var(--cream);}
  .nav-status{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--green); font-family:'IBM Plex Mono',monospace;}
  .nav-status::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block;}

  .hero{position:relative; overflow:hidden; padding:64px 0 60px;}
  .eyebrow{display:inline-flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.06em; color:var(--bronze-soft); border:0.5px solid var(--bronze-deep); padding:6px 12px; border-radius:20px; margin-bottom:24px;}
  .eyebrow::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--bronze); display:inline-block;}
  .hero h1{font-size:clamp(30px,4.4vw,46px); max-width:720px; line-height:1.15;}
  .hero h1 em{font-style:italic; color:var(--bronze-soft);}
  .hero p.lead{font-size:16px; color:var(--muted); max-width:560px; margin:18px 0 0;}

  .tool{margin-top:48px; background:var(--card); border:0.5px solid var(--line); border-radius:var(--radius); overflow:hidden; display:grid; grid-template-columns:1.15fr 0.85fr;}
  @media (max-width:860px){.tool{grid-template-columns:1fr;}}
  .tool-cam-side{position:relative; background:#101415; display:flex; align-items:center; justify-content:center; padding:24px; min-height:400px;}
  .live-frame{position:relative; border-radius:10px; overflow:hidden; line-height:0; box-shadow:0 0 0 0.5px var(--line); width:100%; max-width:440px; aspect-ratio:4/3; background:#0c0f10;}
  .live-frame canvas{width:100%; height:100%; display:block; object-fit:cover;}
  .live-badge{position:absolute; top:12px; left:12px; display:flex; align-items:center; gap:6px; font-size:11px; font-family:'IBM Plex Mono',monospace; background:rgba(20,24,26,0.7); padding:5px 10px; border-radius:20px; color:var(--bronze-soft);}
  .live-badge .dot{width:6px; height:6px; border-radius:50%; background:#e0554f;}
  .cam-fallback{position:absolute; inset:24px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; color:var(--muted); font-size:13px; text-align:center; padding:20px;}

  .tool-controls{padding:28px 30px; display:flex; flex-direction:column; gap:20px;}
  .tool-controls h3{font-size:16px; font-weight:500;}
  .tool-controls > p{font-size:13px; color:var(--muted); margin-top:-12px;}
  .slider-row{display:flex; flex-direction:column; gap:8px;}
  .slider-row .label-row{display:flex; justify-content:space-between; font-size:13px;}
  .slider-row .label-row span:last-child{color:var(--bronze-soft); font-family:'IBM Plex Mono',monospace; font-size:12px;}
  input[type=range]{-webkit-appearance:none; width:100%; height:2px; background:var(--line); border-radius:2px; outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--bronze); cursor:pointer; border:2px solid var(--bg);}
  input[type=range]::-moz-range-thumb{width:16px; height:16px; border-radius:50%; background:var(--bronze); cursor:pointer; border:2px solid var(--bg);}
  
  .tool-actions{display:grid; grid-template-columns: 1fr 1fr; gap:10px;}
  .tool-actions .btn.full-width { grid-column: span 2; }
  @media (max-width: 480px) { .tool-actions { grid-template-columns: 1fr; } .tool-actions .btn.full-width { grid-column: span 1; } }

  .tool-note{font-size:12px; color:var(--muted); border-top:0.5px solid var(--line); padding-top:16px; margin-top:4px;}
  .tool-note strong{color:var(--bronze-soft); font-weight:500;}

  .how{padding:90px 0;}
  .section-head{max-width:560px; margin-bottom:52px;}
  .section-head .eyebrow{margin-bottom:18px;}
  .section-head h2{font-size:clamp(24px,3.2vw,34px);}
  .section-head p{color:var(--muted); margin-top:14px; font-size:15px;}
  .steps{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:0.5px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  @media (max-width:760px){.steps{grid-template-columns:1fr;}}
  .step{background:var(--bg); padding:30px 26px;}
  .step .num{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--bronze-soft); letter-spacing:0.06em;}
  .step h3{font-size:17px; margin:14px 0 8px;}
  .step p{font-size:14px; color:var(--muted);}

  .analysis{padding:0 0 90px;}
  .analysis-card{background:var(--card); border:0.5px solid var(--line); border-radius:var(--radius); padding:32px; display:grid; grid-template-columns:1fr 1.4fr; gap:32px; align-items:start;}
  @media (max-width:760px){.analysis-card{grid-template-columns:1fr;}}
  .analysis-left h3{font-size:16px; margin-bottom:10px;}
  .analysis-left p{font-size:13px; color:var(--muted); margin-bottom:18px;}
  .analysis-status{font-size:13px; color:var(--bronze-soft); min-height:18px; margin-bottom:14px;}
  .analysis-result{display:none; gap:22px;}
  .analysis-result.show{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:0.5px solid var(--line); border-radius:10px; overflow:hidden;}
  @media (max-width:600px){.analysis-result.show{grid-template-columns:1fr;}}
  .ar-block{background:var(--bg-2); padding:22px;}
  .ar-label{font-size:11px; color:var(--muted); letter-spacing:0.05em; margin-bottom:8px;}
  .ar-value{font-size:19px; font-family:'Fraunces',serif; margin-bottom:8px;}
  .ar-desc{font-size:13px; color:var(--muted); line-height:1.6;}
  .ar-nose{display:flex; align-items:center; gap:14px;}
  .ar-nose svg{width:30px; height:52px; flex-shrink:0;}
  .analysis-placeholder{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--muted); font-size:13px; text-align:center; padding:40px 20px; border:1px dashed var(--line); border-radius:10px; min-height:180px;}

  .trust{padding:0 0 100px;}
  .trust-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line); border:0.5px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  @media (max-width:760px){.trust-grid{grid-template-columns:1fr;}}
  .trust-card{background:var(--bg-2); padding:34px 30px;}
  .trust-card h3{font-size:16px; margin-bottom:10px;}
  .trust-card p{font-size:14px; color:var(--muted);}

  <footer>
    <div class="wrap">
      <div class="brand"><svg viewBox="0 0 100 100" width="24" height="24"><circle cx="50" cy="50" r="49" fill="#14181a" stroke="#5c4a2e" stroke-width="1"/><g transform="translate(38,24) scale(0.62)"><path d="M30,8 C14,35 12,58 18,78 C21,95 30,105 42,110 C52,114 57,120 54,127 C48,134 37,137 27,131 C20,127 18,119 21,110 C17,98 17,85 21,70 C24,53 27,38 31,25 Z" fill="#c99a5b"/></g></svg>NoseSim</div>
      <p>© 2026 NoseSim · โปรเจคจำลองเพื่อการศึกษา ไม่ทดแทนคำวินิจฉัยทางการแพทย์</p>
    </div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
/* global FaceMesh, Camera */
(function(){
  const video = document.getElementById('video');
  const scanFrame = document.getElementById('scanFrame');
  const scanPlaceholder = document.getElementById('scanPlaceholder');
  const ringFg = document.getElementById('ringFg');
  const scanCheck = document.getElementById('scanCheck');
  const statusText = document.getElementById('statusText');
  
  const startScanBtn = document.getElementById('startScanBtn');
  const photoUpload = document.getElementById('photoUpload');
  const uploadBtnLabel = document.getElementById('uploadBtnLabel');
  const appUploadBtn = document.getElementById('appUploadBtn');
  const skipBtn = document.getElementById('skipBtn');
  const sourceBadgeText = document.getElementById('sourceBadgeText');
  
  const loginScreen = document.getElementById('loginScreen');
  const appScreen = document.getElementById('appScreen');
  const liveFrame = document.getElementById('liveFrame');
  const camFallback = document.getElementById('camFallback');
  
  const bridgeSlider = document.getElementById('bridgeSlider');
  const widthSlider = document.getElementById('widthSlider');
  const tipSlider = document.getElementById('tipSlider');
  const bridgeValLabel = document.getElementById('bridgeValLabel');
  const widthValLabel = document.getElementById('widthValLabel');
  const tipValLabel = document.getElementById('tipValLabel');
  
  const resetBtn = document.getElementById('resetBtn');
  const compareBtn = document.getElementById('compareBtn');
  const captureBtn = document.getElementById('captureBtn');
  const aiModeBtn = document.getElementById('aiModeBtn');
  const aiHud = document.getElementById('aiHud');
  const captureOverlay = document.getElementById('captureOverlay');
  
  const analyzeSnapBtn = document.getElementById('analyzeSnapBtn');
  const analyzeUploadBtn = document.getElementById('analyzeUploadBtn');
  const analysisPreviewBox = document.getElementById('analysisPreviewBox');
  const analysisVideo = document.getElementById('analysisVideo');
  const analysisCanvas = document.getElementById('analysisCanvas');
  const analysisOverlay = document.getElementById('analysisOverlay');
  const analysisCtx = analysisCanvas.getContext('2d');
  
  let currentCropper = null;
  const cropperModal = document.getElementById('cropperModal');
  const cropperImage = document.getElementById('cropperImage');
  const cropperCancelBtn = document.getElementById('cropperCancelBtn');
  const cropperConfirmBtn = document.getElementById('cropperConfirmBtn');
  
  const analysisStatus = document.getElementById('analysisStatus');
  const analysisPlaceholder = document.getElementById('analysisPlaceholder');
  const analysisNudge = document.getElementById('analysisNudge');
  const analysisNudgeMsg = document.getElementById('analysisNudgeMsg');
  const analysisNudgeBtn = document.getElementById('analysisNudgeBtn');
  let lastAnalysisInfo = null;

  function applyRecommendedPreset(info){
    if(!info) return;
    bridgeSlider.value = info.preset[0] || 0;
    humpSlider.value = info.preset[1] || 0;
    alarSlider.value = info.preset[2] || 0;
    widthSlider.value = info.preset[3] || 0;
    tipSlider.value = info.preset[4] || 0;
    rotationSlider.value = info.preset[5] || 0;
    projectionSlider.value = info.preset[6] || 0;
    onSliderChange();
    window.scrollTo({ top: document.getElementById('tool').offsetTop - 20, behavior: 'smooth' });
  }

  analysisNudgeBtn.addEventListener('click', () => {
    if(lastAnalysisInfo){
      applyRecommendedPreset(lastAnalysisInfo);
    } else {
      document.getElementById('analysis').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
  const analysisResult = document.getElementById('analysisResult');
  const arShapeName = document.getElementById('arShapeName');
  const arShapeDesc = document.getElementById('arShapeDesc');
  const arRecName = document.getElementById('arRecName');
  const arRecDesc = document.getElementById('arRecDesc');
  const arNoseIcon = document.getElementById('arNoseIcon');
  const symBar = document.getElementById('symBar');
  const symScore = document.getElementById('symScore');

  // Use accurate silhouette landmarks
  const FACE_IDX = { top:10, chin:152, cheekL:234, cheekR:454, jawL:132, jawR:361, foreheadL:68, foreheadR:298 };
  const NOSE_PATHS = {
    straight: "M30,6 C18,30 16,50 22,66 C26,78 32,86 40,90",
    subtle:   "M32,6 C16,26 14,46 24,64 C30,78 34,84 42,88",
    tapered:  "M28,6 C20,30 18,52 20,66 C22,80 28,86 38,90",
    bold:     "M34,6 C14,24 12,44 24,62 C31,76 33,84 40,90"
  };
  const SHAPE_INFO = {
    long:   { name:'???????????????????', desc:'????????????????????????????????????????????????????', rec:'????????????', recDesc:'??????????????????????????? ?????????????????????????????', noseKey:'subtle', preset:[20,-10,10] },
    heart:  { name:'????????????????????????', desc:'?????????????????????? ????????????????????', rec:'?????????', recDesc:'???????????????????????????????????????????????', noseKey:'tapered', preset:[15,25,-15] },
    square: { name:'??????????? ??????????', desc:'?????????????????????????????????????????????', rec:'?????????????', recDesc:'???????????????????????????????????????????????????', noseKey:'straight', preset:[40,10,0] },
    round:  { name:'??????????????????', desc:'??????????????????????????????????????????????', rec:'??????????', recDesc:'???????????????????????????????????????????', noseKey:'bold', preset:[60,20,20] },
    oval:   { name:'??????????????????', desc:'?????????????????????????????????', rec:'????????????', recDesc:'????????????????????? ???????????????????????? ????????????? ???????????????', noseKey:'subtle', preset:[25,0,5] }
  };

  function analyzeFaceShape(landmarks, imgW, imgH){
    const p = i => landmarks[i];
    // Convert normalized coordinates back to actual pixel scale so distances are not skewed by aspect ratio
    const dist = (a,b) => Math.hypot((a.x-b.x)*imgW, (a.y-b.y)*imgH);
    const faceHeight = dist(p(FACE_IDX.top), p(FACE_IDX.chin));
    const cheekWidth = dist(p(FACE_IDX.cheekL), p(FACE_IDX.cheekR));
    const jawWidth = dist(p(FACE_IDX.jawL), p(FACE_IDX.jawR));
    const foreheadWidth = dist(p(FACE_IDX.foreheadL), p(FACE_IDX.foreheadR));
    if(!faceHeight || !cheekWidth) return null;

    const widthHeightRatio = cheekWidth / faceHeight;
    const jawCheekRatio = jawWidth / cheekWidth;
    const foreheadJawRatio = foreheadWidth / (jawWidth || 0.0001);

    let key;
    // Data-driven thresholds based on silhouette markers (132/361 for jaw, 68/298 for forehead)
    if(foreheadJawRatio > 1.05) {
       key = 'heart'; 
    } else if(widthHeightRatio > 0.77 && jawCheekRatio > 0.93) {
       key = 'square'; 
    } else if(widthHeightRatio > 0.80 && jawCheekRatio <= 0.93) {
       key = 'round'; 
    } else if(widthHeightRatio < 0.74) {
       key = 'long'; 
    } else {
       key = 'oval'; 
    }
    
    // Calculate Symmetry Score (using pixel distances)
    const nose = p(1);
    const leftW = Math.abs(nose.x - p(FACE_IDX.cheekL).x) * imgW;
    const rightW = Math.abs(p(FACE_IDX.cheekR).x - nose.x) * imgW;
    let symmetry = 100 - (Math.abs(leftW - rightW) / ((leftW + rightW) || 1) * 100);
    symmetry = Math.max(0, Math.min(100, symmetry));

    return { 
        ...SHAPE_INFO[key], 
        symmetryScore: symmetry,
        debugRatios: `(W/H:${widthHeightRatio.toFixed(2)}, J/C:${jawCheekRatio.toFixed(2)}, F/J:${foreheadJawRatio.toFixed(2)})`
    };
  }

  const CANVAS_W = 480, CANVAS_H = 360;
  const canvas = document.createElement('canvas');
  canvas.width = CANVAS_W; canvas.height = CANVAS_H;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  // ---------- Before/After dual side-by-side compare ----------
  const dualViewWrapper = document.getElementById('dualViewWrapper');
  const beforeSideCanvas = document.getElementById('beforeSideCanvas');
  const beforeSideCtx = beforeSideCanvas.getContext('2d');
  beforeSideCanvas.width = CANVAS_W; beforeSideCanvas.height = CANVAS_H;

  // The "after" side will use the main canvas appended into afterSideWrapper
  const afterSideWrapper = document.getElementById('afterSideWrapper');

  let compareMode = false;

  function updateBeforeCanvas(){
    if(!compareMode) return;
    drawSourceToCanvas(beforeSideCtx);
  }

  function setCompareMode(on){
    compareMode = on;
    if(on){
      // Show dual view, hide single view
      dualViewWrapper.classList.add('active');
      liveFrame.style.display = 'none';
      // Move the main canvas into afterSideWrapper
      if(!afterSideWrapper.contains(canvas)){
        afterSideWrapper.appendChild(canvas);
        canvas.style.cssText = 'width:100%; height:100%; display:block; object-fit:cover; position:absolute; top:0; left:0;';
      }
      updateBeforeCanvas();
    } else {
      // Restore single view
      dualViewWrapper.classList.remove('active');
      liveFrame.style.display = '';
      // Move canvas back to liveFrame
      if(!liveFrame.contains(canvas)){
        liveFrame.insertBefore(canvas, liveFrame.firstChild);
        canvas.style.cssText = 'width:100%; height:100%; display:block; object-fit:cover;';
      }
    }
    if(compareBtn){
      compareBtn.classList.toggle('active', on);
      const btnText = compareBtn.querySelector('.compare-btn-text');
      if(btnText) btnText.textContent = on ? '????????????' : '????????????? ????/????';
    }
  }

  window.NOSE_IDX = [168,6,197,195,5,4,1,45,275,49,279,129,358,98,327,2];
  const RING_LEN = 339.3;
  const SMOOTHING_FACTOR = 0.5;

  let state = 'idle'; // idle | scanning | success | filter | error
  let detectStart = null;
  let camera = null;
  let faceMesh = null;
  let latestLandmarks = null;
  let isAiMode = false;
  let smoothedNose = null;
  
  let currentSourceType = 'video'; window.currentSourceType = 'video'; window.currentSourceType = currentSourceType; // video or image
  const imgElement = new Image();

  function setStatus(text){ statusText.textContent = text; }

  function initFaceMesh(){
    faceMesh = new FaceMesh({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
    faceMesh.setOptions({maxNumFaces:1, refineLandmarks:false, minDetectionConfidence:0.5, minTrackingConfidence:0.5});
    faceMesh.onResults(onResults);
  }

  let isCameraPaused = false;
  let isProcessingVideoFrame = false;

  function startCamera(){
    currentSourceType = 'video'; window.currentSourceType = 'video';
    sourceBadgeText.textContent = 'LIVE';

  function updateHUD(lm) {
    if(!isAiMode) return;
    const p = i => lm[i];
    
    // Yaw estimation
    const nose = p(1), cheekL = p(234), cheekR = p(454);
    const distL = Math.hypot(nose.x - cheekL.x, nose.y - cheekL.y);
    const distR = Math.hypot(nose.x - cheekR.x, nose.y - cheekR.y);
    let yaw = ((distR - distL) / ((distL + distR) || 1)) * 90;
    document.getElementById('hudYaw').textContent = yaw.toFixed(1);

    // Pitch estimation
    const top = p(10), chin = p(152);
    const distTop = Math.hypot(nose.x - top.x, nose.y - top.y);
    const distBottom = Math.hypot(nose.x - chin.x, nose.y - chin.y);
    let pitch = ((distBottom - distTop) / ((distTop + distBottom) || 1)) * 90;
    document.getElementById('hudPitch').textContent = pitch.toFixed(1);

    // Smile estimation
    const mouthL = p(61), mouthR = p(291);
    const mouthWidth = Math.hypot(mouthL.x - mouthR.x, mouthL.y - mouthR.y);
    const eyeWidth = Math.hypot(p(33).x - p(263).x, p(33).y - p(263).y);
    let smile = Math.max(0, Math.min(100, ((mouthWidth / eyeWidth) - 0.35) * 250));
    document.getElementById('hudSmile').textContent = Math.round(smile);
  }

  function drawToCanvas(applyFilter){
    drawSourceToCanvas();
    updateBeforeCanvas();

    if(!applyFilter || !latestLandmarks) {
        smoothedNose = null;
        drawWireframe();
        return;
    }

    
    const bridge = parseInt(bridgeSlider.value,10)/100;
    const widthAdj = parseInt(widthSlider.value,10)/100;
    const tipAdj = parseInt(tipSlider.value,10)/100;
    const humpAdj = parseInt(humpSlider.value,10)/100;
    const alarAdj = parseInt(alarSlider.value,10)/100;
    const rotationAdj = parseInt(rotationSlider.value,10)/100;
    const projAdj = parseInt(projectionSlider.value,10)/100;

    bridgeValLabel.textContent = Math.round(bridge*100)+'%';
    widthValLabel.textContent = Math.round(widthAdj*100)+'%';
    tipValLabel.textContent = Math.round(tipAdj*100)+'%';
    humpValLabel.textContent = Math.round(humpAdj*100)+'%';
    alarValLabel.textContent = Math.round(alarAdj*100)+'%';
    rotationValLabel.textContent = Math.round(rotationAdj*100)+'%';
    projectionValLabel.textContent = Math.round(projAdj*100)+'%';

    if(bridge===0 && widthAdj===0 && tipAdj===0 && humpAdj===0 && alarAdj===0 && rotationAdj===0 && projAdj===0) {
      drawWireframe();
      return;
    }

    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    window.NOSE_IDX.forEach(i => {
      const lm = window.latestLandmarks[i];
      if(!lm) return;
      const px = getLmX(lm);
      const py = lm.y*CANVAS_H;
      if(px<minX)minX=px; if(px>maxX)maxX=px;
      if(py<minY)minY=py; if(py>maxY)maxY=py;
    });
    if(minX===Infinity) { drawWireframe(); return; }

    const rawCx = (minX+maxX)/2, rawCy = (minY+maxY)/2;
    const rawRx = Math.max(18,(maxX-minX)/2*1.5);
    const rawRy = Math.max(24,(maxY-minY)/2*1.35);

    if (!smoothedNose || currentSourceType === 'image') {
      smoothedNose = { cx: rawCx, cy: rawCy, rx: rawRx, ry: rawRy };
    } else {
      smoothedNose.cx = smoothedNose.cx * (1 - SMOOTHING_FACTOR) + rawCx * SMOOTHING_FACTOR;
      smoothedNose.cy = smoothedNose.cy * (1 - SMOOTHING_FACTOR) + rawCy * SMOOTHING_FACTOR;
      smoothedNose.rx = smoothedNose.rx * (1 - SMOOTHING_FACTOR) + rawRx * SMOOTHING_FACTOR;
      smoothedNose.ry = smoothedNose.ry * (1 - SMOOTHING_FACTOR) + rawRy * SMOOTHING_FACTOR;
    }

    const { cx, cy, rx, ry } = smoothedNose;

    const x0 = Math.max(0, Math.floor(cx-rx*1.5)), x1 = Math.min(CANVAS_W, Math.ceil(cx+rx*1.5));
    const y0 = Math.max(0, Math.floor(cy-ry*1.5)), y1 = Math.min(CANVAS_H, Math.ceil(cy+ry*1.5));
    if(x1<=x0 || y1<=y0) { drawWireframe(); return; }

    const src = ctx.getImageData(0,0,CANVAS_W,CANVAS_H);
    const out = ctx.createImageData(CANVAS_W,CANVAS_H);
    out.data.set(src.data);

    const bulgeStrength = 1 - bridge*0.55;
    const pinchStrength = 1 + widthAdj*0.9;
    
    for(let y=y0; y<y1; y++){
      for(let x=x0; x<x1; x++){
        const dx=(x-cx)/rx, dy=(y-cy)/ry;
        const r=Math.sqrt(dx*dx+dy*dy);
        if(r>=1.2 || r===0) continue; 
        
        let rn = Math.pow(r, bulgeStrength);
        const scale = (r<1) ? (rn/r) : 1; 
        
        let sdx = dx * scale;
        let sdy = dy * scale;
        
        // Bridge Width
        if(widthAdj!==0 && dy < 0.2){
          const rw = Math.pow(Math.abs(dx), pinchStrength) * Math.sign(dx);
          sdx = sdx*0.5 + rw*0.5;
        }

        // Hump / Slope Logic
        if(humpAdj !== 0 && dy < -0.1 && dy > -0.8) {
          const humpWeight = Math.sin((dy + 0.8) / 0.7 * Math.PI); 
          sdx += humpWeight * humpAdj * 0.2 * Math.sign(dx);
        }

        // Alar / Nostril Width Logic
        if(alarAdj !== 0 && dy > 0.2 && Math.abs(dx) > 0.3) {
          const alarWeight = (dy - 0.2) / 0.8; 
          sdx += alarAdj * alarWeight * 0.4 * Math.sign(dx);
        }
        
        // Tip Lift & Rotation Logic
        let tipOffset = 0;
        if(dy > 0 && tipAdj !== 0){
          const weight = Math.sin(dy * Math.PI); 
          tipOffset = -tipAdj * weight * 0.45;
        }
        if(rotationAdj !== 0 && dy > -0.2) {
          const rotWeight = (dy + 0.2) / 1.2;
          tipOffset -= rotationAdj * rotWeight * 0.5; 
          sdx -= rotationAdj * rotWeight * 0.1 * dx; 
        }

        const srcX = Math.round(cx + sdx*rx);
        const srcY = Math.round(cy + (sdy+tipOffset)*ry);
        if(srcX<0||srcX>=CANVAS_W||srcY<0||srcY>=CANVAS_H) continue;
        
        const di = (y*CANVAS_W+x)*4;
        const si = (srcY*CANVAS_W+srcX)*4;
        
        let r_col = src.data[si];
        let g_col = src.data[si+1];
        let b_col = src.data[si+2];

        // Projection / Highlight Illusion
        if(projAdj > 0 && Math.abs(dx) < 0.5) {
           const centerDist = Math.abs(dx);
           const hlWeight = Math.max(0, 1 - (centerDist * 2.5)) * Math.max(0, 1 - Math.abs(dy));
           r_col = Math.min(255, r_col + 60 * projAdj * hlWeight);
           g_col = Math.min(255, g_col + 60 * projAdj * hlWeight);
           b_col = Math.min(255, b_col + 50 * projAdj * hlWeight);
           
           const shWeight = Math.max(0, Math.sin(centerDist * Math.PI)) * Math.max(0, 1 - Math.abs(dy));
           r_col = Math.max(0, r_col - 30 * projAdj * shWeight);
           g_col = Math.max(0, g_col - 30 * projAdj * shWeight);
           b_col = Math.max(0, b_col - 30 * projAdj * shWeight);
        }

        out.data[di] = r_col;
        out.data[di+1] = g_col;
        out.data[di+2] = b_col;
        out.data[di+3] = src.data[si+3];
      }
    }

    ctx.putImageData(out,0,0);
    drawWireframe();
  }

    arShapeName.innerHTML = `${info.name} <span style="font-size:10px; color:#666;">${info.debugRatios}</span>`;
    arShapeDesc.textContent = info.desc;
    arRecName.textContent = info.rec;
    arRecDesc.textContent = info.recDesc;
    arNoseIcon.querySelector('path').setAttribute('d', NOSE_PATHS[info.noseKey]);
    
    // Update Symmetry Score Bar
    const score = Math.round(info.symmetryScore);
    symScore.textContent = score + '%';
    symBar.style.width = score + '%';
    // Change color based on score
    symBar.style.background = score >= 90 ? 'var(--green)' : score >= 80 ? 'var(--bronze-soft)' : '#e0554f';
    
    analysisPlaceholder.classList.add('hidden');
    analysisResult.classList.add('show');

    // Remember this result and light up the "step 1 done" banner in the tool panel
    lastAnalysisInfo = info;
    analysisNudge.classList.add('done');
    analysisNudge.querySelector('.analysis-nudge-text strong').textContent = `?????????? 1 ????????? � ${info.name}`;
    analysisNudgeMsg.textContent = `????????????: ${info.rec} � ?????????? ${Math.round(info.symmetryScore)}%`;
    analysisNudgeBtn.textContent = '? ??????????????';
    
    // Auto Apply Button Logic (in the analysis card itself)
    document.getElementById('autoApplyBtn').onclick = () => applyRecommendedPreset(info);

    // Small delay to trigger CSS transition for the progress bar
    setTimeout(() => { symBar.style.width = score + '%'; }, 50);
  }

  analyzeSnapBtn.addEventListener('click', () => {
    // If we are looking at an uploaded photo, switch back to camera first
    if (currentSourceType === 'image') {
       appUploadBtn.click(); // Switches main app back to camera mode
       analysisPreviewBox.classList.remove('hidden');
       analysisVideo.srcObject = video.srcObject;
       analysisVideo.play().catch(e => console.error(e));
       analysisVideo.style.opacity = '1';
       analysisCanvas.style.opacity = '0';
       analysisStatus.textContent = '??????????????... ????????????????????????????????????????';
       analyzeSnapBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg> ?? ??????????????';
       return;
    }

    if(!window.latestLandmarks) {
      analysisStatus.textContent = '??????????? ??????????????????????????';
      return;
    }
    const isShowingResult = analysisCanvas.style.opacity === '1';
    
    if ((analysisPreviewBox.classList.contains('hidden') || isShowingResult) && currentSourceType === 'video') {
       analysisPreviewBox.classList.remove('hidden');
       analysisVideo.srcObject = video.srcObject;
       analysisVideo.play().catch(e => console.error(e));
       analysisVideo.style.opacity = '1';
       analysisCanvas.style.opacity = '0';
       analysisStatus.textContent = '??????????????? ?????????????????????????';
       analyzeSnapBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg> ?? ??????????????';
       return;
    }

    analysisStatus.textContent = '?????????????????????...';
    analysisPreviewBox.classList.remove('hidden');
    
    if (currentSourceType === 'video') {
      let count = 3;
      analysisOverlay.textContent = count;
      analysisOverlay.classList.remove('hidden');
      analysisOverlay.style.opacity = '1';
      
      const interval = setInterval(() => {
        count--;
        if (count > 0) {
           analysisOverlay.textContent = count;
        } else if (count === 0) {
           analysisOverlay.style.background = 'rgba(255,255,255,0.8)';
           analysisOverlay.textContent = '';
        } else {
           clearInterval(interval);
           analysisOverlay.style.opacity = '0';
           setTimeout(() => { 
             analysisOverlay.classList.add('hidden'); 
             analysisOverlay.style.background = 'rgba(0,0,0,0.4)';
           }, 200);
           
           runAnalysis();
           analyzeSnapBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg> ???????????';
        }
      }, 800);
    } else {
      runAnalysis();

  });

  analyzeUploadBtn.addEventListener('click', () => {
     uploadTarget = 'analysis';
     photoUpload.click();
  });

  // Manual Shape Override
  document.getElementById('manualShapeSelect').addEventListener('change', (e) => {
      const val = e.target.value;
      if(!val) return;
      const info = SHAPE_INFO[val];
      if(!info) return;
      
      document.getElementById('arShapeName').innerHTML = `${info.name} <span style="font-size:10px; color:#666;">(Manual Override)</span>`;
      document.getElementById('arShapeDesc').textContent = info.desc;
      document.getElementById('arRecName').textContent = info.rec;
      document.getElementById('arRecDesc').textContent = info.recDesc;
      document.getElementById('arNoseIcon').querySelector('path').setAttribute('d', NOSE_PATHS[info.noseKey]);
      document.getElementById('autoApplyBtn').dataset.preset = JSON.stringify(info.preset);

})();

    

  /* ---------- CUSTOM THREE.JS VIEWER LOGIC ---------- */
  const threeBtn = document.getElementById('threeBtn');
  const threeModal = document.getElementById('threeModal');
  const closeThreeBtn = document.getElementById('closeThreeBtn');
  const threeContainer = document.getElementById('threeContainer');
  const countdownDiv = document.getElementById('countdownDiv');

  let scene, camera3D, renderer, gltfModel, faceMesh3D, wireframeMesh;
  let threeInitialized = false;
  let staticLandmarks = null;
  let staticVideoTexture = null;

  function initThreeJS() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    camera3D = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera3D.position.set(0, 0, 450);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    threeContainer.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(0, 50, 500);
    scene.add(dirLight);

    // Load High-Poly GLB
    const loader = new THREE.GLTFLoader();
    loader.load('canonical_face.glb', function(gltf) {
      gltfModel = gltf.scene;
      
      // Extract the mesh
      gltfModel.traverse(function(child) {
        if (child.isMesh) {
          faceMesh3D = child;
          
          // Apply professional material
          faceMesh3D.material = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            side: THREE.DoubleSide,
            roughness: 0.3,
            metalness: 0.2
          });
          
          // Create wireframe overlay
          const wireMat = new THREE.MeshBasicMaterial({
            color: 0x00ffcc,
            wireframe: true,
            transparent: true,
            opacity: 0.3
          });
          wireframeMesh = new THREE.Mesh(faceMesh3D.geometry, wireMat);
          wireframeMesh.scale.set(1.001, 1.001, 1.001);
          gltfModel.add(wireframeMesh);
        }
      });
      
      // Center and scale
      gltfModel.scale.set(1, 1, 1);
      gltfModel.position.set(0, 0, 0);
      scene.add(gltfModel);
      
      if (staticLandmarks) updateThreeJS();
      
    }, undefined, function(error) {
      console.error(error);
      alert('Error loading GLB model!');
    });

    window.addEventListener('resize', () => {
      if(!threeModal.classList.contains('hidden')) {
        camera3D.aspect = window.innerWidth / window.innerHeight;
        camera3D.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });

    animateThreeJS();
  }

  function updateThreeJS() {
    if (!faceMesh3D || !staticLandmarks) return;
    const geometry = faceMesh3D.geometry;
    const positions = geometry.attributes.position.array;
    const uvs = geometry.attributes.uv.array;

    const w = CANVAS_W; 
    const h = CANVAS_H;

    // We assume the GLB has exactly 468 vertices mapping to FaceMesh.
    if (positions.length / 3 === 468) {
        for (let i = 0; i < 468; i++) {
          const lm = staticLandmarks[i];
          positions[i * 3] = (lm.x - 0.5) * w;
          positions[i * 3 + 1] = -(lm.y - 0.5) * h;
          positions[i * 3 + 2] = -lm.z * w; 
    
          uvs[i * 2] = lm.x;
          uvs[i * 2 + 1] = 1.0 - lm.y;
        }
        geometry.attributes.position.needsUpdate = true;
        geometry.attributes.uv.needsUpdate = true;
        geometry.computeVertexNormals();
    } else {
        console.warn("GLB vertex count mismatch: " + (positions.length/3));
    }

    if (staticVideoTexture) {
      faceMesh3D.material.map = staticVideoTexture;
      faceMesh3D.material.needsUpdate = true;
    }
  }

  function animateThreeJS() {
    requestAnimationFrame(animateThreeJS);
    if (!threeModal.classList.contains('hidden')) {
      if (gltfModel) {
          gltfModel.rotation.y = Math.sin(Date.now() * 0.001) * 0.3;
          gltfModel.rotation.x = Math.sin(Date.now() * 0.0007) * 0.1;
      }
      renderer.render(scene, camera3D);
    }
  }

  threeBtn.addEventListener('click', () => {
    if (!latestLandmarks) {
      alert('กรุณารอให้ระบบจับใบหน้าก่อนครับ');
      return;
    }

    staticLandmarks = JSON.parse(JSON.stringify(latestLandmarks));
    
    const snapCanvas = document.createElement('canvas');
    snapCanvas.width = video.videoWidth;
    snapCanvas.height = video.videoHeight;
    const snapCtx = snapCanvas.getContext('2d');
    
    snapCtx.translate(snapCanvas.width, 0);
    snapCtx.scale(-1, 1);
    snapCtx.drawImage(video, 0, 0, snapCanvas.width, snapCanvas.height);
    
    staticVideoTexture = new THREE.CanvasTexture(snapCanvas);
    staticVideoTexture.colorSpace = THREE.SRGBColorSpace;

    if (!threeInitialized) {
      initThreeJS();
      threeInitialized = true;
    }
    
    threeModal.classList.remove('hidden');
    threeContainer.style.opacity = '0';
    countdownDiv.classList.remove('hidden');
    
    let count = 3;
    countdownDiv.textContent = count;
    const timer = setInterval(() => {
      count--;
      if (count > 0) {
        countdownDiv.textContent = count;
      } else if (count === 0) {
        countdownDiv.textContent = 'สแกน 3D GLB สำเร็จ!';
      } else {
        clearInterval(timer);
        countdownDiv.classList.add('hidden');
        if (faceMesh3D) updateThreeJS();
        threeContainer.style.opacity = '1';
      }
    }, 800);
  });

  closeThreeBtn.addEventListener('click', () => {
    threeModal.classList.add('hidden');
    staticLandmarks = null;
    if (staticVideoTexture) {
      staticVideoTexture.dispose();
      staticVideoTexture = null;
    }
  });

})();
</script>
